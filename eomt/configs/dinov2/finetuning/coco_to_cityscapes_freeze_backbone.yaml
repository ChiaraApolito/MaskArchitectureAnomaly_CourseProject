trainer:
  max_epochs: 15
  precision: 16-mixed          # AMP: meno memoria, training piu' veloce
  logger:
    class_path: lightning.pytorch.loggers.wandb.WandbLogger
    init_args:
      resume: allow
      project: "eomt"
      name: "coco_to_cityscapes_stage1_head"

# STAGE 1 (guida Task 5): "fine-tune just the prediction head".
# Encoder/backbone congelato -> si allenano solo query + mask_head + class_head
# + scale blocks. La class_head e' random (load_ckpt_class_head: False) perche'
# Cityscapes ha 19 classi != COCO: questo stage la stabilizza senza distruggere
# il decoder pre-addestrato su COCO. Nessuna cache: forward normale con
# augmentation live ad ogni step.
model:
  class_path: training.mask_classification_semantic.MaskClassificationSemantic
  init_args:
    attn_mask_annealing_enabled: False
    ckpt_path: weights/eomt_coco.bin
    load_ckpt_class_head: False
    freeze_encoder: True
    lr: 1e-4
    weight_decay: 0.05
    num_points: 12544          # default upstream (non abbassare: la mask loss diventa rumorosa)
    network:
      class_path: models.eomt.EoMT
      init_args:
        num_q: 200             # combacia col checkpoint COCO
        num_blocks: 3
        masked_attn_enabled: False
        encoder:
          class_path: models.vit.ViT
          init_args:
            backbone_name: vit_base_patch14_reg4_dinov2

data:
  class_path: datasets.cityscapes_semantic.CityscapesSemantic
  init_args:
    img_size: [512, 512]       # piu' veloce su L4; e' l'unico override che si propaga (vedi main.py link_arguments)
